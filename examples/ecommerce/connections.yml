# Credentials come from environment variables; never write secrets in this file.
default: ${COSMOS_DATA_SOURCE:-local}

data_sources:
  local:
    type: duckdb
    path: ${COSMOS_DUCKDB_PATH:-data/ecommerce.duckdb}

  postgres:
    type: postgres
    uri: ${COSMOS_PG_URI:-postgresql://cosmos:cosmos@localhost:15432/cosmos}

  sqlserver:
    type: sqlserver
    uri: ${COSMOS_MSSQL_URI:-mssql+pymssql://sa:Cosmos!Passw0rd@localhost:14330/master}
    schema_map:
      public: cosmos   # `public` is a reserved word in T-SQL

  databricks:
    type: databricks
    options:
      server_hostname: ${DATABRICKS_SERVER_HOSTNAME:-}
      http_path: ${DATABRICKS_HTTP_PATH:-}
      access_token: ${DATABRICKS_TOKEN:-}
      profile: ${DATABRICKS_CONFIG_PROFILE:-}   # alternative to the token: a Databricks CLI profile
      catalog: ${DATABRICKS_CATALOG:-cosmos_demo}
    cost:                # illustrative rates for `cosmos usage`; set your own
      per_second: 0.002  # warehouse time
      currency: USD

  snowflake:
    type: snowflake
    options:
      account: ${SNOWFLAKE_ACCOUNT:-}               # <org>-<account>
      user: ${SNOWFLAKE_USER:-}
      private_key_file: ${SNOWFLAKE_PRIVATE_KEY_FILE:-}  # key-pair login; never commit the key
      connection_name: ${SNOWFLAKE_CONNECTION_NAME:-}    # alternative: ~/.snowflake/connections.toml
      role: ${SNOWFLAKE_ROLE:-}
      warehouse: ${SNOWFLAKE_WAREHOUSE:-}
      database: ${SNOWFLAKE_DATABASE:-COSMOS_DEMO}

  mysql:
    type: mysql
    uri: ${COSMOS_MYSQL_URI:-mysql+pymysql://root:cosmos@127.0.0.1:13306/}

  mariadb:
    type: mariadb
    uri: ${COSMOS_MARIADB_URI:-mysql+pymysql://root:cosmos@127.0.0.1:13307/}

  oracle:
    type: oracle
    options:
      dsn: ${COSMOS_ORACLE_DSN:-127.0.0.1:11521/FREEPDB1}
      user: ${COSMOS_ORACLE_USER:-cosmos}
      password: ${COSMOS_ORACLE_PASSWORD:-cosmos}
    schema_map: { public: cosmos }   # in Oracle a schema is a user

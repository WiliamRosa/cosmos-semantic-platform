# yaml-language-server: $schema=../../../schema/cosmos-semantic.v1.schema.json
version: 1

glossary:
  - concept: cliente
    pref_label: { pt: Cliente, en: Customer }
    alt_labels: { pt: [comprador, consumidor], en: [buyer] }
    definition: Pessoa ou empresa cadastrada que pode fazer pedidos
    maps_to: entity:customer

  - concept: cliente_ativo
    pref_label: { pt: Cliente ativo, en: Active customer }
    alt_labels: { pt: [cliente recorrente, comprador ativo], en: [active buyer] }
    broader: cliente
    definition: Cliente com compra nos últimos 90 dias
    maps_to: rule:cliente_ativo

  - concept: receita_bruta
    pref_label: { pt: Receita bruta, en: Gross revenue }
    alt_labels: { pt: [faturamento bruto, vendas] }
    definition: Soma do valor dos pedidos, antes de descontos
    maps_to: metric:revenue

  - concept: receita_liquida
    pref_label: { pt: Receita líquida, en: Net revenue }
    alt_labels: { pt: [faturamento líquido] }
    broader: receita_bruta
    definition: Receita bruta menos descontos
    maps_to: metric:net_revenue

  - concept: ticket_medio
    pref_label: { pt: Ticket médio, en: Average order value }
    alt_labels: { pt: [valor médio do pedido] }
    definition: Receita bruta dividida pelo número de pedidos
    maps_to: metric:average_order_value

  - concept: regiao_do_cliente
    pref_label: { pt: Região do cliente }
    alt_labels: { pt: [região] }
    definition: Região do Brasil onde o cliente mora
    maps_to: dimension:customers.region

business_rules:
  - name: cliente_ativo
    kind: predicate
    owner: diretoria-comercial
    effective_from: 2026-01-01
    description: Cliente com compra nos últimos 90 dias
    inputs:
      ultima_compra: time
    logic: "{ultima_compra} >= CURRENT_DATE - INTERVAL '90' DAY"
    applies_to:
      - model: customers
        bind: { ultima_compra: last_order_at }
    tests:
      - given: { ultima_compra: 2026-10-01 }
        today: 2026-10-16
        expect: true
      - given: { ultima_compra: 2026-05-01 }
        today: 2026-10-16
        expect: false

  - name: faixa_pedido
    kind: classification
    owner: diretoria-comercial
    effective_from: 2026-01-01
    description: Faixa do pedido pelo valor bruto
    inputs:
      valor: number
    decision_table:
      - when: "{valor} >= 5000"
        then: Grande
      - when: "{valor} >= 1000"
        then: Médio
      - otherwise: Pequeno
    applies_to:
      - model: orders
        bind: { valor: amount }
    tests:
      - given: { valor: 7200 }
        expect: Grande
      - given: { valor: 1000 }
        expect: Médio
      - given: { valor: 80 }
        expect: Pequeno

  - name: valor_liquido_pedido
    kind: derived
    owner: controladoria
    effective_from: 2026-01-01
    description: Valor do pedido menos o desconto
    inputs:
      valor: number
      desconto: number
    logic: "{valor} - {desconto}"
    applies_to:
      - model: orders
        bind: { valor: amount, desconto: discount }
    tests:
      - given: { valor: 100, desconto: 10 }
        expect: 90

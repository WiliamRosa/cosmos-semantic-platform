# TPC-H reference queries (DEC-4): a second reference case beside reference/queries.yml.
#
# Each case compares the engine's result with hand-written SQL that never goes through the
# engine, on the data of DuckDB's `tpch` extension (`CALL dbgen(sf=...)`). The values change
# with the scale factor; what holds at every scale factor is that the engine's result equals the
# hand-written SQL's. The same cases are timed by the performance baseline
# (tests/perf/test_tpch_perf.py). The SQL is in the Postgres dialect, as in reference/.
#
# The cases borrow the shapes of TPC-H queries (joins, grains, filters); only T06 is exactly a
# TPC-H query (Q14). The hand-written SQL uses inner joins where the engine writes LEFT JOINs
# (T01, T02, T04, T05, T06 and T07): they agree only because TPC-H data has full
# referential integrity (every foreign key finds its row).

cases:
  - id: T01
    category: tpch
    phase: 0
    title: Revenue by customer region (a four-join path from line items)
    request:
      metrics: [revenue]
      dimensions: [region.name]
    sql: |
      SELECT r.r_name AS region__name, SUM(l.l_extendedprice * (1 - l.l_discount)) AS revenue
      FROM lineitem l
      JOIN orders o ON o.o_orderkey = l.l_orderkey
      JOIN customer c ON c.c_custkey = o.o_custkey
      JOIN nation n ON n.n_nationkey = c.c_nationkey
      JOIN region r ON r.r_regionkey = n.n_regionkey
      GROUP BY r.r_name

  - id: T02
    category: tpch
    phase: 0
    title: Revenue (line grain) and orders (order grain) by order year
    request:
      metrics: [revenue, order_count]
      dimensions: [orders.ordered_at__year]
    sql: |
      WITH l AS (
        SELECT DATE_TRUNC('year', o.o_orderdate) AS y,
               SUM(l.l_extendedprice * (1 - l.l_discount)) AS revenue
        FROM lineitem l JOIN orders o ON o.o_orderkey = l.l_orderkey GROUP BY 1
      ), o AS (
        SELECT DATE_TRUNC('year', o_orderdate) AS y, COUNT(*) AS order_count
        FROM orders GROUP BY 1
      )
      SELECT o.y AS orders__ordered_at__year, l.revenue, o.order_count
      FROM o LEFT JOIN l ON l.y = o.y

  - id: T03
    category: tpch
    phase: 0
    title: Pricing summary by return flag and line status (TPC-H Q1 shape, with a ratio)
    request:
      metrics: [quantity, avg_quantity, line_count, discount_rate]
      dimensions: [lineitem.return_flag, lineitem.line_status]
      filters: ["{lineitem.shipped_at} <= DATE '1998-09-02'"]
    sql: |
      SELECT l_returnflag AS lineitem__return_flag, l_linestatus AS lineitem__line_status,
             SUM(l_quantity) AS quantity, AVG(l_quantity) AS avg_quantity, COUNT(*) AS line_count,
             CAST(SUM(l_extendedprice * l_discount) AS DOUBLE PRECISION)
               / NULLIF(SUM(l_extendedprice), 0) AS discount_rate
      FROM lineitem
      WHERE l_shipdate <= DATE '1998-09-02'
      GROUP BY l_returnflag, l_linestatus

  - id: T04
    category: tpch
    phase: 0
    title: Revenue per order by market segment (ratio across two grains)
    request:
      metrics: [revenue_per_order]
      dimensions: [customer.segment]
    sql: |
      WITH l AS (
        SELECT c.c_mktsegment AS segment, SUM(l.l_extendedprice * (1 - l.l_discount)) AS revenue
        FROM lineitem l
        JOIN orders o ON o.o_orderkey = l.l_orderkey
        JOIN customer c ON c.c_custkey = o.o_custkey
        GROUP BY c.c_mktsegment
      ), o AS (
        SELECT c.c_mktsegment AS segment, COUNT(*) AS order_count
        FROM orders o JOIN customer c ON c.c_custkey = o.o_custkey
        GROUP BY c.c_mktsegment
      )
      SELECT o.segment AS customer__segment,
             CAST(l.revenue AS DOUBLE PRECISION) / NULLIF(o.order_count, 0) AS revenue_per_order
      FROM o LEFT JOIN l ON l.segment = o.segment

  - id: T05
    category: tpch
    phase: 0
    title: Returned revenue by customer nation in one region and quarter (metric filter)
    request:
      metrics: [returned_revenue]
      dimensions: [nation.name]
      filters:
        - "{region.name} = 'EUROPE'"
        - "{orders.ordered_at} >= DATE '1993-10-01'"
        - "{orders.ordered_at} < DATE '1994-01-01'"
    # The metric filter stays inside the sum, as in reference/queries.yml R14: a nation with
    # lines in the window but none returned is a row with NULL, not a missing row.
    sql: |
      SELECT n.n_name AS nation__name,
             SUM(CASE WHEN l.l_returnflag = 'R'
                      THEN l.l_extendedprice * (1 - l.l_discount) END) AS returned_revenue
      FROM lineitem l
      JOIN orders o ON o.o_orderkey = l.l_orderkey
      JOIN customer c ON c.c_custkey = o.o_custkey
      JOIN nation n ON n.n_nationkey = c.c_nationkey
      JOIN region r ON r.r_regionkey = n.n_regionkey
      WHERE r.r_name = 'EUROPE'
        AND o.o_orderdate >= DATE '1993-10-01' AND o.o_orderdate < DATE '1994-01-01'
      GROUP BY n.n_name

  - id: T06
    category: tpch
    phase: 0
    title: Promotional revenue share in one month (TPC-H Q14, derived metric)
    request:
      metrics: [promo_revenue_share]
      filters:
        - "{lineitem.shipped_at} >= DATE '1995-09-01'"
        - "{lineitem.shipped_at} < DATE '1995-10-01'"
    sql: |
      SELECT 100.0 * SUM(CASE WHEN p.p_type LIKE 'PROMO%'
                              THEN l.l_extendedprice * (1 - l.l_discount) END)
             / SUM(l.l_extendedprice * (1 - l.l_discount)) AS promo_revenue_share
      FROM lineitem l JOIN part p ON p.p_partkey = l.l_partkey
      WHERE l.l_shipdate >= DATE '1995-09-01' AND l.l_shipdate < DATE '1995-10-01'

  - id: T07
    category: tpch
    phase: 0
    title: Customers (customer grain) and orders (order grain) by market segment
    request:
      metrics: [customer_count, order_count, order_value]
      dimensions: [customer.segment]
    sql: |
      WITH c AS (
        SELECT c_mktsegment AS segment, COUNT(*) AS customer_count FROM customer GROUP BY 1
      ), o AS (
        SELECT c.c_mktsegment AS segment, COUNT(*) AS order_count, SUM(o.o_totalprice) AS order_value
        FROM orders o JOIN customer c ON c.c_custkey = o.o_custkey GROUP BY 1
      )
      SELECT c.segment AS customer__segment, c.customer_count, o.order_count, o.order_value
      FROM c LEFT JOIN o ON o.segment = c.segment

[project]
name = "cosmos-semantic"
version = "0.2.0"
description = "A semantic layer with its own engine: governed metrics, business rules and a glossary for AI agents and BI, with verifiable numbers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Wiliam Rosa" }]
keywords = [
    "semantic layer",
    "metrics",
    "mcp",
    "ai agents",
    "databricks",
    "snowflake",
    "oracle",
    "mysql",
    "mariadb",
    "duckdb",
    "postgres",
    "sql server",
    "dbt",
    "power bi",
    "skos",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlglot>=30.0,<31",
    "pyarrow>=17.0",
    "typer>=0.15",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.2"]
postgres = ["adbc-driver-postgresql>=1.4", "adbc-driver-manager>=1.4"]
databricks = ["databricks-sql-connector>=4.0", "databricks-sdk>=0.50"]
snowflake = ["snowflake-connector-python>=3.12"]
sqlserver = ["sqlalchemy>=2.0", "pymssql>=2.3"]
mysql = ["sqlalchemy>=2.0", "pymysql>=1.1"]
oracle = ["oracledb>=3.1"]
testdata = ["faker>=30.0"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "pyjwt[crypto]>=2.9", "httpx>=0.27", "mcp>=2.0,<3"]
ai = ["anthropic>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/WiliamRosa/cosmos-semantic-platform"
Documentation = "https://github.com/WiliamRosa/cosmos-semantic-platform/tree/main/docs"
Changelog = "https://github.com/WiliamRosa/cosmos-semantic-platform/blob/main/CHANGELOG.md"
Issues = "https://github.com/WiliamRosa/cosmos-semantic-platform/issues"

[project.scripts]
cosmos = "cosmos_semantic.cli:app"
# Same command under the package name, so `uvx cosmos-semantic ...` works (MCP registry).
cosmos-semantic = "cosmos_semantic.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "rdflib>=7.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The console's static export is git-ignored but built before packaging (release.yml).
[tool.hatch.build]
artifacts = ["src/cosmos_semantic/console_dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_semantic"]

[tool.hatch.build.targets.sdist]
exclude = ["console/node_modules", "console/.next", "console/out"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: precisa de um Postgres em COSMOS_PG_URI",
    "sqlserver: precisa de um SQL Server em COSMOS_MSSQL_URI",
    "databricks: needs a configured Databricks SQL warehouse",
    "snowflake: needs a configured Snowflake account and warehouse",
    "mysql: needs a MySQL server at COSMOS_MYSQL_URI",
    "mariadb: needs a MariaDB server at COSMOS_MARIADB_URI",
    "oracle: needs an Oracle Database at COSMOS_ORACLE_DSN",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

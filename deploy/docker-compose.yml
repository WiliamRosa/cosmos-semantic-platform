# Local environment: demo Postgres.
#   docker compose -p cosmos-semantic -f deploy/docker-compose.yml up -d
#   uv run cosmos demo-data --target postgres -c examples/ecommerce/connections.yml
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: cosmos
      POSTGRES_DB: cosmos
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos"]
      interval: 2s
      retries: 30
    volumes:
      - cosmos-pg:/var/lib/postgresql/data

  # Optional: docker compose -p cosmos-semantic -f deploy/docker-compose.yml --profile sqlserver up -d
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Cosmos!Passw0rd"
    ports:
      - "14330:1433"

  # Optional: ... --profile mysql up -d
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: cosmos
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcosmos"]
      interval: 2s
      retries: 60

  # Optional: ... --profile mariadb up -d
  mariadb:
    image: mariadb:11.4
    profiles: [mariadb]
    environment:
      MARIADB_ROOT_PASSWORD: cosmos
    ports:
      - "13307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  # Optional: ... --profile oracle up -d  (Oracle Database 23ai Free)
  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: [oracle]
    environment:
      ORACLE_PASSWORD: cosmos
      APP_USER: cosmos
      APP_USER_PASSWORD: cosmos
    ports:
      - "11521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      retries: 60

volumes:
  cosmos-pg:

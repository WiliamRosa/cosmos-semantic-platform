# Ambiente local: Postgres de demonstração.
#   docker compose -f deploy/docker-compose.yml up -d
#   uv run cosmos demo-data --target postgres -c examples/ecommerce/connections.yml
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: cosmos
      POSTGRES_DB: cosmos
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos"]
      interval: 2s
      retries: 30
    volumes:
      - cosmos-pg:/var/lib/postgresql/data

volumes:
  cosmos-pg:

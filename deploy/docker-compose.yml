# Local environment: demo Postgres.
#   docker compose -p cosmos-semantic -f deploy/docker-compose.yml up -d
#   uv run cosmos demo-data --target postgres -c examples/ecommerce/connections.yml
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: cosmos
      POSTGRES_DB: cosmos
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos"]
      interval: 2s
      retries: 30
    volumes:
      - cosmos-pg:/var/lib/postgresql/data

  # Optional: docker compose -p cosmos-semantic -f deploy/docker-compose.yml --profile sqlserver up -d
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Cosmos!Passw0rd"
    ports:
      - "14330:1433"

volumes:
  cosmos-pg:

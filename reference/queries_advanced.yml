# Advanced suite: cases where databases tend to disagree.
#
# The hand-written SQL defines the semantics the engine promises on every data source:
# - division is always real (never integer division) and safe against zero;
# - the average of an integer column is a real average;
# - weeks start on Monday (ISO);
# - nulls sort last, and null dimension values form their own group;
# - booleans arrive as true/false (1/0 in SQL Server).

cases:
  - id: A01
    category: tipos
    phase: 1
    title: Boolean dimension (order had a discount)
    request:
      metrics: [order_count, revenue]
      dimensions: [orders.has_discount]
    sql: |
      SELECT discount > 0 AS orders__has_discount, COUNT(*) AS order_count, SUM(amount) AS revenue
      FROM public.orders GROUP BY discount > 0
    sql_by_dialect:
      tsql: |
        SELECT CASE WHEN discount > 0 THEN 1 ELSE 0 END AS orders__has_discount,
               COUNT(*) AS order_count, SUM(amount) AS revenue
        FROM public.orders GROUP BY CASE WHEN discount > 0 THEN 1 ELSE 0 END

  - id: A02
    category: tipos
    phase: 1
    title: Average of an integer column by category (null category and accents)
    request:
      metrics: [avg_quantity, line_count]
      dimensions: [products.category]
    sql: |
      SELECT p.category AS products__category,
             AVG(CAST(i.quantity AS DOUBLE PRECISION)) AS avg_quantity, COUNT(*) AS line_count
      FROM public.order_items i LEFT JOIN public.products p ON p.product_id = i.product_id
      GROUP BY p.category
    sql_by_dialect:
      tsql: |
        SELECT p.category AS products__category,
               AVG(CAST(i.quantity AS FLOAT)) AS avg_quantity, COUNT(*) AS line_count
        FROM public.order_items i LEFT JOIN public.products p ON p.product_id = i.product_id
        GROUP BY p.category

  - id: A03
    category: tipos
    phase: 1
    title: Division between integer counts (orders per buyer) by segment, null included
    request:
      metrics: [orders_per_buyer]
      dimensions: [customers.segment]
    user: { region: Midwest }
    sql: |
      SELECT c.segment AS customers__segment,
             CAST(COUNT(*) AS DOUBLE PRECISION) / NULLIF(COUNT(DISTINCT o.customer_id), 0) AS orders_per_buyer
      FROM public.orders o LEFT JOIN public.customers c ON c.customer_id = o.customer_id
      WHERE c.region = 'Midwest'
      GROUP BY c.segment
    sql_by_dialect:
      tsql: |
        SELECT c.segment AS customers__segment,
               CAST(COUNT(*) AS FLOAT) / NULLIF(COUNT(DISTINCT o.customer_id), 0) AS orders_per_buyer
        FROM public.orders o LEFT JOIN public.customers c ON c.customer_id = o.customer_id
        WHERE c.region = 'Midwest'
        GROUP BY c.segment

  - id: A04
    category: tipos
    phase: 1
    title: Derived metric across models with division (units per order)
    request:
      metrics: [items_per_order]
      dimensions: [orders.status]
    sql: |
      WITH i AS (
        SELECT o.status, SUM(i.quantity) AS items
        FROM public.order_items i JOIN public.orders o ON o.order_id = i.order_id GROUP BY o.status
      ), o AS (SELECT status, COUNT(*) AS n FROM public.orders GROUP BY status)
      SELECT o.status AS orders__status, CAST(i.items AS DOUBLE PRECISION) / NULLIF(o.n, 0) AS items_per_order
      FROM o LEFT JOIN i ON i.status = o.status
    sql_by_dialect:
      tsql: |
        WITH i AS (
          SELECT o.status, SUM(i.quantity) AS items
          FROM public.order_items i JOIN public.orders o ON o.order_id = i.order_id GROUP BY o.status
        ), o AS (SELECT status, COUNT(*) AS n FROM public.orders GROUP BY status)
        SELECT o.status AS orders__status, CAST(i.items AS FLOAT) / NULLIF(o.n, 0) AS items_per_order
        FROM o LEFT JOIN i ON i.status = o.status

  - id: A05
    category: tempo
    phase: 1
    title: Ratio by quarter
    request:
      metrics: [discount_rate]
      dimensions: [orders.ordered_at__quarter]
    sql: |
      SELECT DATE_TRUNC('quarter', ordered_at) AS orders__ordered_at__quarter,
             CAST(SUM(discount) AS DOUBLE PRECISION) / NULLIF(SUM(amount), 0) AS discount_rate
      FROM public.orders GROUP BY 1
    sql_by_dialect:
      tsql: |
        SELECT DATETRUNC(quarter, ordered_at) AS orders__ordered_at__quarter,
               CAST(SUM(discount) AS FLOAT) / NULLIF(SUM(amount), 0) AS discount_rate
        FROM public.orders GROUP BY DATETRUNC(quarter, ordered_at)

  - id: A06
    category: tempo
    phase: 1
    title: Weeks start on Monday on every database
    request:
      metrics: [order_count]
      dimensions: [orders.ordered_at__week]
    sql: |
      SELECT DATE_TRUNC('week', ordered_at) AS orders__ordered_at__week, COUNT(*) AS order_count
      FROM public.orders GROUP BY 1
    sql_by_dialect:
      tsql: |
        SELECT CAST(DATEADD(day, -((DATEPART(weekday, ordered_at) + @@DATEFIRST - 2) % 7), CAST(ordered_at AS DATE)) AS DATETIME2) AS orders__ordered_at__week,
               COUNT(*) AS order_count
        FROM public.orders
        GROUP BY CAST(DATEADD(day, -((DATEPART(weekday, ordered_at) + @@DATEFIRST - 2) % 7), CAST(ordered_at AS DATE)) AS DATETIME2)

  - id: A07
    category: tempo
    phase: 1
    title: Hour grain over the last 60 days
    request:
      metrics: [order_count]
      dimensions: [orders.ordered_at__hour]
      filters: ["{orders.ordered_at} >= CURRENT_DATE - INTERVAL '60' DAY"]
    sql: |
      SELECT DATE_TRUNC('hour', ordered_at) AS orders__ordered_at__hour, COUNT(*) AS order_count
      FROM public.orders WHERE ordered_at >= CURRENT_DATE - INTERVAL '60' DAY GROUP BY 1
    sql_by_dialect:
      tsql: |
        SELECT DATETRUNC(hour, ordered_at) AS orders__ordered_at__hour, COUNT(*) AS order_count
        FROM public.orders WHERE ordered_at >= DATEADD(day, -60, CAST(GETDATE() AS DATE))
        GROUP BY DATETRUNC(hour, ordered_at)

  - id: A08
    category: tempo
    phase: 1
    title: Year-to-date by month
    request:
      metrics: [revenue_year_to_date]
      dimensions: [orders.ordered_at__month]
    sql: |
      WITH m AS (SELECT DATE_TRUNC('month', ordered_at) AS m, SUM(amount) AS r FROM public.orders GROUP BY 1)
      SELECT m AS orders__ordered_at__month,
             SUM(r) OVER (PARTITION BY DATE_TRUNC('year', m) ORDER BY m) AS revenue_year_to_date
      FROM m
    sql_by_dialect:
      tsql: |
        WITH m AS (SELECT DATETRUNC(month, ordered_at) AS m, SUM(amount) AS r FROM public.orders GROUP BY DATETRUNC(month, ordered_at))
        SELECT m AS orders__ordered_at__month,
               SUM(r) OVER (PARTITION BY DATETRUNC(year, m) ORDER BY m ROWS UNBOUNDED PRECEDING) AS revenue_year_to_date
        FROM m

  - id: A09
    category: tempo
    phase: 1
    title: Month-to-date by status and day (window with an extra partition)
    request:
      metrics: [revenue_month_to_date]
      dimensions: [orders.status, orders.ordered_at__day]
      filters: ["{orders.ordered_at} >= CURRENT_DATE - INTERVAL '45' DAY"]
    sql: |
      WITH d AS (
        SELECT status, DATE_TRUNC('day', ordered_at) AS d, SUM(amount) AS r
        FROM public.orders WHERE ordered_at >= CURRENT_DATE - INTERVAL '45' DAY GROUP BY 1, 2
      )
      SELECT status AS orders__status, d AS orders__ordered_at__day,
             SUM(r) OVER (PARTITION BY status, DATE_TRUNC('month', d) ORDER BY d) AS revenue_month_to_date
      FROM d
    sql_by_dialect:
      tsql: |
        WITH d AS (
          SELECT status, DATETRUNC(day, ordered_at) AS d, SUM(amount) AS r
          FROM public.orders WHERE ordered_at >= DATEADD(day, -45, CAST(GETDATE() AS DATE))
          GROUP BY status, DATETRUNC(day, ordered_at)
        )
        SELECT status AS orders__status, d AS orders__ordered_at__day,
               SUM(r) OVER (PARTITION BY status, DATETRUNC(month, d) ORDER BY d ROWS UNBOUNDED PRECEDING) AS revenue_month_to_date
        FROM d

  - id: A10
    category: regras
    phase: 1
    title: Classification rule (decision table) as a grouping, starting from payments
    request:
      metrics: [paid_value, payment_count]
      dimensions: [orders.order_size_band]
    sql: |
      SELECT CASE WHEN o.amount >= 5000 THEN 'Large' WHEN o.amount >= 1000 THEN 'Medium' ELSE 'Small' END
               AS orders__order_size_band,
             SUM(p.value) AS paid_value, COUNT(*) AS payment_count
      FROM public.payments p JOIN public.orders o ON o.order_id = p.order_id
      GROUP BY CASE WHEN o.amount >= 5000 THEN 'Large' WHEN o.amount >= 1000 THEN 'Medium' ELSE 'Small' END

  - id: A11
    category: regras
    phase: 1
    title: Rule from another model as a filter, plus classification and a row filter
    request:
      metrics: [revenue, order_count]
      dimensions: [orders.order_size_band]
      filters: ["{rule.active_customer}"]
    user: { region: Northeast }
    sql: |
      SELECT CASE WHEN o.amount >= 5000 THEN 'Large' WHEN o.amount >= 1000 THEN 'Medium' ELSE 'Small' END
               AS orders__order_size_band,
             SUM(o.amount) AS revenue, COUNT(*) AS order_count
      FROM public.orders o JOIN public.customers c ON c.customer_id = o.customer_id
      WHERE c.last_order_at >= CURRENT_DATE - INTERVAL '90' DAY AND c.region = 'Northeast'
      GROUP BY CASE WHEN o.amount >= 5000 THEN 'Large' WHEN o.amount >= 1000 THEN 'Medium' ELSE 'Small' END
    sql_by_dialect:
      tsql: |
        SELECT CASE WHEN o.amount >= 5000 THEN 'Large' WHEN o.amount >= 1000 THEN 'Medium' ELSE 'Small' END
                 AS orders__order_size_band,
               SUM(o.amount) AS revenue, COUNT(*) AS order_count
        FROM public.orders o JOIN public.customers c ON c.customer_id = o.customer_id
        WHERE c.last_order_at >= DATEADD(day, -90, CAST(GETDATE() AS DATE)) AND c.region = 'Northeast'
        GROUP BY CASE WHEN o.amount >= 5000 THEN 'Large' WHEN o.amount >= 1000 THEN 'Medium' ELSE 'Small' END

  - id: A12
    category: regras
    phase: 1
    title: Derived rule (net value) used in a numeric filter
    request:
      metrics: [order_count]
      dimensions: [orders.status]
      filters: ["{orders.order_net_value} > 3000"]
    sql: |
      SELECT status AS orders__status, COUNT(*) AS order_count
      FROM public.orders WHERE amount - discount > 3000 GROUP BY status

  - id: A13
    category: filtros
    phase: 1
    title: BETWEEN filter on a numeric dimension
    request:
      metrics: [paid_value, payment_count]
      dimensions: [payments.method]
      filters: ["{payments.installments} BETWEEN 2 AND 6"]
    sql: |
      SELECT method AS payments__method, SUM(value) AS paid_value, COUNT(*) AS payment_count
      FROM public.payments WHERE installments BETWEEN 2 AND 6 GROUP BY method

  - id: A14
    category: filtros
    phase: 1
    title: LIKE, OR with IS NULL and NOT, across two models
    request:
      metrics: [item_revenue]
      dimensions: [products.category]
      filters:
        - "({products.category} LIKE 'E%' OR {products.category} IS NULL) AND NOT {orders.status} = 'canceled'"
    sql: |
      SELECT p.category AS products__category, SUM(i.quantity * i.unit_price) AS item_revenue
      FROM public.order_items i
      LEFT JOIN public.products p ON p.product_id = i.product_id
      LEFT JOIN public.orders o ON o.order_id = i.order_id
      WHERE (p.category LIKE 'E%' OR p.category IS NULL) AND NOT o.status = 'canceled'
      GROUP BY p.category

  - id: A15
    category: filtros
    phase: 1
    title: Null dimension group with IN and IS NULL
    request:
      metrics: [customer_count, revenue]
      dimensions: [customers.segment]
      filters: ["{customers.segment} IN ('SMB', 'Enterprise') OR {customers.segment} IS NULL"]
    user: { region: Midwest }
    sql: |
      WITH c AS (
        SELECT segment, COUNT(DISTINCT customer_id) AS customer_count FROM public.customers
        WHERE region = 'Midwest' AND (segment IN ('SMB', 'Enterprise') OR segment IS NULL) GROUP BY segment
      ), o AS (
        SELECT c.segment, SUM(o.amount) AS revenue
        FROM public.orders o JOIN public.customers c ON c.customer_id = o.customer_id
        WHERE c.region = 'Midwest' AND (c.segment IN ('SMB', 'Enterprise') OR c.segment IS NULL) GROUP BY c.segment
      )
      SELECT c.segment AS customers__segment, c.customer_count, o.revenue
      FROM c LEFT JOIN o ON o.segment IS NOT DISTINCT FROM c.segment

  - id: A16
    category: ordenacao
    phase: 1
    title: Top 3 alphabetically with a null category (nulls last)
    request:
      metrics: [item_revenue]
      dimensions: [products.category]
      order_by: [products.category]
      limit: 3
    sql: |
      SELECT p.category AS products__category, SUM(i.quantity * i.unit_price) AS item_revenue
      FROM public.order_items i LEFT JOIN public.products p ON p.product_id = i.product_id
      GROUP BY p.category ORDER BY p.category ASC NULLS LAST LIMIT 3
    sql_by_dialect:
      tsql: |
        SELECT TOP 3 p.category AS products__category, SUM(i.quantity * i.unit_price) AS item_revenue
        FROM public.order_items i LEFT JOIN public.products p ON p.product_id = i.product_id
        GROUP BY p.category ORDER BY CASE WHEN p.category IS NULL THEN 1 ELSE 0 END, p.category

  - id: A17
    category: ordenacao
    phase: 1
    title: Top 4 by a numeric dimension, descending, nulls last
    request:
      metrics: [paid_value]
      dimensions: [payments.installments]
      order_by: [-payments.installments]
      limit: 4
    sql: |
      SELECT installments AS payments__installments, SUM(value) AS paid_value
      FROM public.payments GROUP BY installments ORDER BY installments DESC NULLS LAST LIMIT 4
    sql_by_dialect:
      tsql: |
        SELECT TOP 4 installments AS payments__installments, SUM(value) AS paid_value
        FROM public.payments GROUP BY installments
        ORDER BY CASE WHEN installments IS NULL THEN 1 ELSE 0 END, installments DESC

  - id: A18
    category: vazio
    phase: 1
    title: A user from a region without customers gets an empty result, not an error
    request:
      metrics: [revenue]
      dimensions: [customers.region]
    user: { region: Atlântida }
    expect_empty: true
    sql: |
      SELECT c.region AS customers__region, SUM(o.amount) AS revenue
      FROM public.orders o JOIN public.customers c ON c.customer_id = o.customer_id
      WHERE c.region = 'Atlântida' GROUP BY c.region

  - id: A19
    category: vazio
    phase: 1
    title: Totals from two models with no dimensions and no rows become one row of nulls
    request:
      metrics: [revenue, paid_value]
      filters: ["{orders.status} = 'inexistente'"]
    sql: |
      SELECT (SELECT SUM(amount) FROM public.orders WHERE status = 'inexistente') AS revenue,
             (SELECT SUM(p.value) FROM public.payments p JOIN public.orders o ON o.order_id = p.order_id
              WHERE o.status = 'inexistente') AS paid_value

  - id: A20
    category: fan-out
    phase: 1
    title: Three distinct counts at three grains, two-hop dimension
    request:
      metrics: [buyers, customer_count, line_count]
      dimensions: [customers.region]
    user: { region: South }
    sql: |
      WITH b AS (
        SELECT c.region, COUNT(DISTINCT o.customer_id) AS buyers
        FROM public.orders o JOIN public.customers c ON c.customer_id = o.customer_id
        WHERE c.region = 'South' GROUP BY c.region
      ), cc AS (
        SELECT region, COUNT(DISTINCT customer_id) AS customer_count
        FROM public.customers WHERE region = 'South' GROUP BY region
      ), l AS (
        SELECT c.region, COUNT(*) AS line_count
        FROM public.order_items i
        JOIN public.orders o ON o.order_id = i.order_id
        JOIN public.customers c ON c.customer_id = o.customer_id
        WHERE c.region = 'South' GROUP BY c.region
      )
      SELECT cc.region AS customers__region, b.buyers, cc.customer_count, l.line_count
      FROM cc LEFT JOIN b ON b.region = cc.region LEFT JOIN l ON l.region = cc.region

  - id: A21
    category: fan-out
    phase: 1
    title: Boolean filter plus a filtered metric by year
    request:
      metrics: [completed_revenue, revenue]
      dimensions: [orders.ordered_at__year]
      filters: ["{orders.has_discount}"]
    sql: |
      SELECT DATE_TRUNC('year', ordered_at) AS orders__ordered_at__year,
             SUM(CASE WHEN status = 'completed' THEN amount END) AS completed_revenue,
             SUM(amount) AS revenue
      FROM public.orders WHERE discount > 0 GROUP BY 1
    sql_by_dialect:
      tsql: |
        SELECT DATETRUNC(year, ordered_at) AS orders__ordered_at__year,
               SUM(CASE WHEN status = 'completed' THEN amount END) AS completed_revenue,
               SUM(amount) AS revenue
        FROM public.orders WHERE discount > 0 GROUP BY DATETRUNC(year, ordered_at)

  - id: A22
    category: politicas
    phase: 1
    title: An application (not an agent) may group by sensitive data, with accents
    request:
      metrics: [customer_count]
      dimensions: [customers.health_plan]
    user: { region: Midwest }
    channel: api
    sql: |
      SELECT health_plan AS customers__health_plan, COUNT(DISTINCT customer_id) AS customer_count
      FROM public.customers WHERE region = 'Midwest' GROUP BY health_plan

  - id: A23
    category: joins
    phase: 1
    title: Two dimensions from different branches (customer and seller) starting from items
    request:
      metrics: [line_count, item_revenue]
      dimensions: [customers.region, sellers.region]
    user: { region: Mountain }
    sql: |
      SELECT c.region AS customers__region, s.region AS sellers__region,
             COUNT(*) AS line_count, SUM(i.quantity * i.unit_price) AS item_revenue
      FROM public.order_items i
      JOIN public.orders o ON o.order_id = i.order_id
      JOIN public.customers c ON c.customer_id = o.customer_id
      JOIN public.sellers s ON s.seller_id = i.seller_id
      WHERE c.region = 'Mountain'
      GROUP BY c.region, s.region

  - id: A24
    category: politicas
    phase: 1
    title: An agent cannot filter by personal data such as e-mail
    request:
      metrics: [customer_count]
      filters: ["{customers.email} LIKE '%@gmail.com'"]
    user: { region: Midwest }
    channel: mcp
    expect_error: PolicyError

  # -- One-to-many attribution ---------------------------------------------
  - id: A25
    category: one-to-many
    phase: 2
    title: Order revenue by product category (each order once per category it contains)
    request:
      metrics: [revenue]
      dimensions: [products.category]
    sql: |
      SELECT b.category AS products__category, SUM(o.amount) AS revenue
      FROM public.orders o
      LEFT JOIN (
        SELECT DISTINCT i.order_id, p.category
        FROM public.order_items i LEFT JOIN public.products p ON p.product_id = i.product_id
      ) b ON b.order_id = o.order_id
      GROUP BY b.category

  - id: A26
    category: one-to-many
    phase: 2
    title: Revenue of orders containing a Home item, by status (filter on the many side)
    request:
      metrics: [revenue, order_count]
      dimensions: [orders.status]
      filters: ["{products.category} = 'Home'"]
    sql: |
      SELECT o.status AS orders__status, SUM(o.amount) AS revenue, COUNT(*) AS order_count
      FROM public.orders o
      WHERE EXISTS (
        SELECT 1 FROM public.order_items i JOIN public.products p ON p.product_id = i.product_id
        WHERE i.order_id = o.order_id AND p.category = 'Home'
      )
      GROUP BY o.status

  - id: A27
    category: one-to-many
    phase: 2
    title: Customers who bought each category, with the user's row filter
    request:
      metrics: [customer_count]
      dimensions: [products.category]
    user: { region: Northeast }
    sql: |
      SELECT b.category AS products__category, COUNT(DISTINCT c.customer_id) AS customer_count
      FROM public.customers c
      LEFT JOIN (
        SELECT DISTINCT o.customer_id, p.category
        FROM public.order_items i
        JOIN public.orders o ON o.order_id = i.order_id
        LEFT JOIN public.products p ON p.product_id = i.product_id
      ) b ON b.customer_id = c.customer_id
      WHERE c.region = 'Northeast'
      GROUP BY b.category

  - id: A28
    category: tipos
    phase: 3
    title: Boolean dimension compared with false in a filter (a comparison inside a comparison)
    request:
      metrics: [order_count, revenue]
      dimensions: [orders.status]
      filters: ["{orders.has_discount} = false"]
    sql: |
      SELECT status AS orders__status, COUNT(*) AS order_count, SUM(amount) AS revenue
      FROM public.orders WHERE NOT (discount > 0) GROUP BY status

  # -- Rolling windows ------------------------------------------------------
  # The value on day D sums the facts dated from D - 6 days to D. Days with no orders are not
  # in the output (as with grain_to_date), but they still count as days of the window; the
  # first days of the data have fewer than 7 days before them.
  - id: A29
    category: tempo
    phase: 3
    title: Rolling 7-day revenue by day, from the first day of the data
    request:
      metrics: [revenue_rolling_7_days]
      dimensions: [orders.ordered_at__day]
    sql: |
      SELECT d.dd AS orders__ordered_at__day, SUM(o.amount) AS revenue_rolling_7_days
      FROM (SELECT DISTINCT DATE_TRUNC('day', ordered_at) AS dd FROM public.orders) d
      JOIN public.orders o
        ON o.ordered_at >= d.dd - INTERVAL '6' DAY AND o.ordered_at < d.dd + INTERVAL '1' DAY
      GROUP BY d.dd
    sql_by_dialect:
      tsql: |
        SELECT d.dd AS orders__ordered_at__day, SUM(o.amount) AS revenue_rolling_7_days
        FROM (SELECT DISTINCT DATETRUNC(day, ordered_at) AS dd FROM public.orders) d
        JOIN public.orders o
          ON o.ordered_at >= DATEADD(day, -6, d.dd) AND o.ordered_at < DATEADD(day, 1, d.dd)
        GROUP BY d.dd

  # A filter on the window's time dimension chooses the output days; each day's window still
  # reads the 6 days before it, from facts the filter leaves out (DEC-34). Other filters apply
  # to the facts first.
  - id: A30
    category: tempo
    phase: 3
    title: Rolling 7-day revenue by status and day over the last 45 days, with full windows
    request:
      metrics: [revenue_rolling_7_days, revenue]
      dimensions: [orders.status, orders.ordered_at__day]
      filters: ["{orders.ordered_at} >= CURRENT_DATE - INTERVAL '45' DAY"]
    sql: |
      WITH f AS (
        SELECT status, ordered_at FROM public.orders
        WHERE ordered_at >= CURRENT_DATE - INTERVAL '45' DAY
      )
      SELECT d.status AS orders__status, d.dd AS orders__ordered_at__day,
             SUM(o.amount) AS revenue_rolling_7_days,
             SUM(CASE WHEN o.ordered_at >= d.dd THEN o.amount END) AS revenue
      FROM (SELECT DISTINCT status, DATE_TRUNC('day', ordered_at) AS dd FROM f) d
      JOIN public.orders o
        ON o.status = d.status
        AND o.ordered_at >= d.dd - INTERVAL '6' DAY AND o.ordered_at < d.dd + INTERVAL '1' DAY
      GROUP BY d.status, d.dd
    sql_by_dialect:
      tsql: |
        WITH f AS (
          SELECT status, ordered_at FROM public.orders
          WHERE ordered_at >= DATEADD(day, -45, CAST(GETDATE() AS DATE))
        )
        SELECT d.status AS orders__status, d.dd AS orders__ordered_at__day,
               SUM(o.amount) AS revenue_rolling_7_days,
               SUM(CASE WHEN o.ordered_at >= d.dd THEN o.amount END) AS revenue
        FROM (SELECT DISTINCT status, DATETRUNC(day, ordered_at) AS dd FROM f) d
        JOIN public.orders o
          ON o.status = d.status
          AND o.ordered_at >= DATEADD(day, -6, d.dd) AND o.ordered_at < DATEADD(day, 1, d.dd)
        GROUP BY d.status, d.dd

  # -- Cumulative metrics over min/max measures; refused grains (DEC-21) -----
  - id: A31
    category: tempo
    phase: 3
    title: Year-to-date maximum order value by status and month (a running max, not a sum)
    request:
      metrics: [max_order_value_year_to_date]
      dimensions: [orders.status, orders.ordered_at__month]
    sql: |
      WITH m AS (SELECT DISTINCT status, DATE_TRUNC('month', ordered_at) AS m FROM public.orders)
      SELECT m.status AS orders__status, m.m AS orders__ordered_at__month,
             MAX(o.amount) AS max_order_value_year_to_date
      FROM m
      JOIN public.orders o
        ON o.status = m.status
        AND DATE_TRUNC('year', o.ordered_at) = DATE_TRUNC('year', m.m)
        AND DATE_TRUNC('month', o.ordered_at) <= m.m
      GROUP BY m.status, m.m
    sql_by_dialect:
      tsql: |
        WITH m AS (SELECT DISTINCT status, DATETRUNC(month, ordered_at) AS m FROM public.orders)
        SELECT m.status AS orders__status, m.m AS orders__ordered_at__month,
               MAX(o.amount) AS max_order_value_year_to_date
        FROM m
        JOIN public.orders o
          ON o.status = m.status
          AND DATETRUNC(year, o.ordered_at) = DATETRUNC(year, m.m)
          AND DATETRUNC(month, o.ordered_at) <= m.m
        GROUP BY m.status, m.m

  - id: A32
    category: tempo
    phase: 3
    title: A month-to-date metric by quarter is refused (it would be the quarter's total)
    request:
      metrics: [revenue_month_to_date]
      dimensions: [orders.ordered_at__quarter]
    expect_error: QueryError

  # A rolling window over null groups: a null segment is a group of its own inside the window
  # (rows are matched null-safely), and a null day (customers without orders have no
  # last_order_at) is a row whose value is null: no day is within N days of an unknown day.
  - id: A33
    category: tempo
    phase: 3
    title: Rolling 30-day count with null segments and null days, under a row filter
    request:
      metrics: [customers_rolling_30_days]
      dimensions: [customers.segment, customers.last_order_at__day]
    user: { region: Northeast }
    sql: |
      WITH c AS (
        SELECT segment, last_order_at FROM public.customers WHERE region = 'Northeast'
      )
      SELECT d.segment AS customers__segment, d.dd AS customers__last_order_at__day,
             SUM(CASE WHEN c.last_order_at IS NOT NULL THEN 1 END) AS customers_rolling_30_days
      FROM (SELECT DISTINCT segment, DATE_TRUNC('day', last_order_at) AS dd FROM c) d
      LEFT JOIN c
        ON (c.segment = d.segment OR (c.segment IS NULL AND d.segment IS NULL))
        AND c.last_order_at >= d.dd - INTERVAL '29' DAY
        AND c.last_order_at < d.dd + INTERVAL '1' DAY
      GROUP BY d.segment, d.dd
    sql_by_dialect:
      tsql: |
        WITH c AS (
          SELECT segment, last_order_at FROM public.customers WHERE region = 'Northeast'
        )
        SELECT d.segment AS customers__segment, d.dd AS customers__last_order_at__day,
               SUM(CASE WHEN c.last_order_at IS NOT NULL THEN 1 END) AS customers_rolling_30_days
        FROM (SELECT DISTINCT segment, DATETRUNC(day, last_order_at) AS dd FROM c) d
        LEFT JOIN c
          ON (c.segment = d.segment OR (c.segment IS NULL AND d.segment IS NULL))
          AND c.last_order_at >= DATEADD(day, -29, d.dd)
          AND c.last_order_at < DATEADD(day, 1, d.dd)
        GROUP BY d.segment, d.dd

  # min and max combine over the window: the smallest order of the 7 days ending on day D is
  # the smallest of the daily minimums. The daily minimum is alongside.
  - id: A34
    category: tempo
    phase: 3
    title: Rolling 7-day minimum by status and day, with the daily minimum alongside
    request:
      metrics: [smallest_order_rolling_7_days, smallest_order]
      dimensions: [orders.status, orders.ordered_at__day]
    sql: |
      SELECT d.status AS orders__status, d.dd AS orders__ordered_at__day,
             MIN(o.amount) AS smallest_order_rolling_7_days,
             MIN(CASE WHEN o.ordered_at >= d.dd THEN o.amount END) AS smallest_order
      FROM (SELECT DISTINCT status, DATE_TRUNC('day', ordered_at) AS dd FROM public.orders) d
      JOIN public.orders o
        ON o.status = d.status
        AND o.ordered_at >= d.dd - INTERVAL '6' DAY AND o.ordered_at < d.dd + INTERVAL '1' DAY
      GROUP BY d.status, d.dd
    sql_by_dialect:
      tsql: |
        SELECT d.status AS orders__status, d.dd AS orders__ordered_at__day,
               MIN(o.amount) AS smallest_order_rolling_7_days,
               MIN(CASE WHEN o.ordered_at >= d.dd THEN o.amount END) AS smallest_order
        FROM (SELECT DISTINCT status, DATETRUNC(day, ordered_at) AS dd FROM public.orders) d
        JOIN public.orders o
          ON o.status = d.status
          AND o.ordered_at >= DATEADD(day, -6, d.dd) AND o.ordered_at < DATEADD(day, 1, d.dd)
        GROUP BY d.status, d.dd

  # -- Inputs read at an earlier period (DEC-18) -----------------------------
  # The value for a period is the input's value for the period that starts the offset earlier,
  # at the query's grain. The rows are the periods with facts; a period whose earlier period has
  # no facts gets NULL. The hand-written SQL pairs months by a month number (year * 12 + month),
  # never by date arithmetic, so December -> January is checked independently of the engine.
  - id: A35
    category: tempo
    phase: 3
    title: Revenue, revenue of the month before and month-over-month growth, across a year change
    request:
      metrics: [revenue, revenue_prev_month, revenue_mom_growth]
      dimensions: [orders.ordered_at__month]
    sql: |
      WITH monthly AS (
        SELECT DATE_TRUNC('month', ordered_at) AS mon,
               EXTRACT(YEAR FROM ordered_at) * 12 + EXTRACT(MONTH FROM ordered_at) AS k,
               SUM(amount) AS revenue
        FROM public.orders
        GROUP BY DATE_TRUNC('month', ordered_at),
                 EXTRACT(YEAR FROM ordered_at) * 12 + EXTRACT(MONTH FROM ordered_at)
      )
      SELECT cur.mon AS orders__ordered_at__month, cur.revenue AS revenue,
             prev.revenue AS revenue_prev_month,
             CAST(cur.revenue - prev.revenue AS DOUBLE PRECISION) / NULLIF(prev.revenue, 0)
               AS revenue_mom_growth
      FROM monthly cur
      LEFT JOIN monthly prev ON prev.k = cur.k - 1
    sql_by_dialect:
      tsql: |
        WITH monthly AS (
          SELECT DATETRUNC(month, ordered_at) AS mon,
                 YEAR(ordered_at) * 12 + MONTH(ordered_at) AS k,
                 SUM(amount) AS revenue
          FROM public.orders
          GROUP BY DATETRUNC(month, ordered_at), YEAR(ordered_at) * 12 + MONTH(ordered_at)
        )
        SELECT cur.mon AS orders__ordered_at__month, cur.revenue AS revenue,
               prev.revenue AS revenue_prev_month,
               CAST(cur.revenue - prev.revenue AS FLOAT) / NULLIF(prev.revenue, 0)
                 AS revenue_mom_growth
        FROM monthly cur
        LEFT JOIN monthly prev ON prev.k = cur.k - 1

  # A 70-day gap in the facts always holds a whole calendar month with no rows: that month is
  # not in the output, and the month after it has no revenue of the month before (NULL, so the
  # growth is NULL too). Each status is shifted on its own.
  - id: A36
    category: tempo
    phase: 3
    title: Revenue of the month before by status, with a month without orders
    request:
      metrics: [revenue_prev_month, revenue_mom_growth]
      dimensions: [orders.status, orders.ordered_at__month]
      filters:
        - "{orders.ordered_at} < CURRENT_DATE - INTERVAL '300' DAY OR {orders.ordered_at} >= CURRENT_DATE - INTERVAL '230' DAY"
    sql: |
      WITH f AS (
        SELECT status, ordered_at, amount FROM public.orders
        WHERE ordered_at < CURRENT_DATE - INTERVAL '300' DAY
           OR ordered_at >= CURRENT_DATE - INTERVAL '230' DAY
      ), monthly AS (
        SELECT status, DATE_TRUNC('month', ordered_at) AS mon,
               EXTRACT(YEAR FROM ordered_at) * 12 + EXTRACT(MONTH FROM ordered_at) AS k,
               SUM(amount) AS revenue
        FROM f
        GROUP BY status, DATE_TRUNC('month', ordered_at),
                 EXTRACT(YEAR FROM ordered_at) * 12 + EXTRACT(MONTH FROM ordered_at)
      )
      SELECT cur.status AS orders__status, cur.mon AS orders__ordered_at__month,
             prev.revenue AS revenue_prev_month,
             CAST(cur.revenue - prev.revenue AS DOUBLE PRECISION) / NULLIF(prev.revenue, 0)
               AS revenue_mom_growth
      FROM monthly cur
      LEFT JOIN monthly prev
        ON (prev.status = cur.status OR (prev.status IS NULL AND cur.status IS NULL))
        AND prev.k = cur.k - 1
    sql_by_dialect:
      tsql: |
        WITH f AS (
          SELECT status, ordered_at, amount FROM public.orders
          WHERE ordered_at < DATEADD(day, -300, CAST(GETDATE() AS DATE))
             OR ordered_at >= DATEADD(day, -230, CAST(GETDATE() AS DATE))
        ), monthly AS (
          SELECT status, DATETRUNC(month, ordered_at) AS mon,
                 YEAR(ordered_at) * 12 + MONTH(ordered_at) AS k,
                 SUM(amount) AS revenue
          FROM f
          GROUP BY status, DATETRUNC(month, ordered_at), YEAR(ordered_at) * 12 + MONTH(ordered_at)
        )
        SELECT cur.status AS orders__status, cur.mon AS orders__ordered_at__month,
               prev.revenue AS revenue_prev_month,
               CAST(cur.revenue - prev.revenue AS FLOAT) / NULLIF(prev.revenue, 0)
                 AS revenue_mom_growth
        FROM monthly cur
        LEFT JOIN monthly prev
          ON (prev.status = cur.status OR (prev.status IS NULL AND cur.status IS NULL))
          AND prev.k = cur.k - 1

  # An offset in days, alone in the request: the rows are the days with orders, and a day whose
  # day a week before has no orders gets NULL, not 0. Days are paired by a day number (days
  # since 2000-01-01), never by date arithmetic, so the check is independent of the engine's.
  - id: A37
    category: tempo
    phase: 3
    title: Orders of the same day one week before, by day
    request:
      metrics: [order_count_7_days_earlier]
      dimensions: [orders.ordered_at__day]
    sql: |
      WITH daily AS (
        SELECT DATE_TRUNC('day', ordered_at) AS dd, CAST(ordered_at AS DATE) - DATE '2000-01-01' AS k, COUNT(*) AS n
        FROM public.orders GROUP BY DATE_TRUNC('day', ordered_at), CAST(ordered_at AS DATE) - DATE '2000-01-01'
      )
      SELECT cur.dd AS orders__ordered_at__day, prev.n AS order_count_7_days_earlier
      FROM daily cur
      LEFT JOIN daily prev ON prev.k = cur.k - 7
    sql_by_dialect:
      tsql: |
        WITH daily AS (
          SELECT DATETRUNC(day, ordered_at) AS dd, DATEDIFF(day, '2000-01-01', ordered_at) AS k, COUNT(*) AS n
          FROM public.orders GROUP BY DATETRUNC(day, ordered_at), DATEDIFF(day, '2000-01-01', ordered_at)
        )
        SELECT cur.dd AS orders__ordered_at__day, prev.n AS order_count_7_days_earlier
        FROM daily cur
        LEFT JOIN daily prev ON prev.k = cur.k - 7
      mysql: |
        WITH daily AS (
          SELECT CAST(DATE(ordered_at) AS DATETIME) AS dd, DATEDIFF(ordered_at, '2000-01-01') AS k, COUNT(*) AS n
          FROM public.orders GROUP BY CAST(DATE(ordered_at) AS DATETIME), DATEDIFF(ordered_at, '2000-01-01')
        )
        SELECT cur.dd AS orders__ordered_at__day, prev.n AS order_count_7_days_earlier
        FROM daily cur
        LEFT JOIN daily prev ON prev.k = cur.k - 7
      oracle: |
        WITH daily AS (
          SELECT CAST(TRUNC(ordered_at) AS TIMESTAMP) AS dd, CAST(TRUNC(ordered_at) AS DATE) - DATE '2000-01-01' AS k, COUNT(*) AS n
          FROM public.orders GROUP BY CAST(TRUNC(ordered_at) AS TIMESTAMP), CAST(TRUNC(ordered_at) AS DATE) - DATE '2000-01-01'
        )
        SELECT cur.dd AS orders__ordered_at__day, prev.n AS order_count_7_days_earlier
        FROM daily cur
        LEFT JOIN daily prev ON prev.k = cur.k - 7
      databricks: |
        WITH daily AS (
          SELECT DATE_TRUNC('day', ordered_at) AS dd, DATEDIFF(CAST(ordered_at AS DATE), DATE'2000-01-01') AS k, COUNT(*) AS n
          FROM public.orders GROUP BY DATE_TRUNC('day', ordered_at), DATEDIFF(CAST(ordered_at AS DATE), DATE'2000-01-01')
        )
        SELECT cur.dd AS orders__ordered_at__day, prev.n AS order_count_7_days_earlier
        FROM daily cur
        LEFT JOIN daily prev ON prev.k = cur.k - 7
      snowflake: |
        WITH daily AS (
          SELECT DATE_TRUNC('day', ordered_at) AS dd, DATEDIFF(day, '2000-01-01', ordered_at) AS k, COUNT(*) AS n
          FROM public.orders GROUP BY DATE_TRUNC('day', ordered_at), DATEDIFF(day, '2000-01-01', ordered_at)
        )
        SELECT cur.dd AS orders__ordered_at__day, prev.n AS order_count_7_days_earlier
        FROM daily cur
        LEFT JOIN daily prev ON prev.k = cur.k - 7
      trino: |
        WITH daily AS (
          SELECT DATE_TRUNC('day', ordered_at) AS dd, DATE_DIFF('day', DATE '2000-01-01', CAST(ordered_at AS DATE)) AS k, COUNT(*) AS n
          FROM public.orders GROUP BY DATE_TRUNC('day', ordered_at), DATE_DIFF('day', DATE '2000-01-01', CAST(ordered_at AS DATE))
        )
        SELECT cur.dd AS orders__ordered_at__day, prev.n AS order_count_7_days_earlier
        FROM daily cur
        LEFT JOIN daily prev ON prev.k = cur.k - 7

  - id: A38
    category: tempo
    phase: 3
    title: An offset of 1 month by day is refused (only by month, quarter or year)
    request:
      metrics: [revenue_prev_month]
      dimensions: [orders.ordered_at__day]
    expect_error: QueryError

  # -- A week under a longer to-date period (DEC-28) --------------------------
  - id: A39
    category: tempo
    phase: 3
    title: A year-to-date metric by week is refused (a week across a new year would count in the old one)
    request:
      metrics: [revenue_year_to_date]
      dimensions: [orders.ordered_at__week]
    expect_error: QueryError

  # -- Filters on metric values (DEC-29) --------------------------------------
  # `metric_filters` keep the rows of the result whose metric values meet the conditions, after
  # aggregation at the requested grain; the row filters still apply to the facts first, and the
  # order and the limit apply to the rows kept. The hand-written SQL uses HAVING, never the
  # outer WHERE the engine writes, so the two are checked against each other.
  - id: A40
    category: filtros
    phase: 3
    title: States above a revenue threshold under the user's row filter; the limit applies after it
    request:
      metrics: [revenue, order_count]
      dimensions: [customers.state]
      metric_filters: ["{revenue} > 450000", "{order_count} >= 100"]
      order_by: [revenue]
      limit: 1
    user: { region: Northeast }
    sql: |
      SELECT c.state AS customers__state, SUM(o.amount) AS revenue, COUNT(*) AS order_count
      FROM public.orders o LEFT JOIN public.customers c ON c.customer_id = o.customer_id
      WHERE c.region = 'Northeast'
      GROUP BY c.state
      HAVING SUM(o.amount) > 450000 AND COUNT(*) >= 100
      ORDER BY revenue
      LIMIT 1
    sql_by_dialect:
      tsql: |
        SELECT TOP 1 c.state AS customers__state, SUM(o.amount) AS revenue,
               COUNT(*) AS order_count
        FROM public.orders o LEFT JOIN public.customers c ON c.customer_id = o.customer_id
        WHERE c.region = 'Northeast'
        GROUP BY c.state
        HAVING SUM(o.amount) > 450000 AND COUNT(*) >= 100
        ORDER BY revenue

  # A ratio compared with a number, together with a count: a null segment is a group of its
  # own and is kept when it meets the conditions.
  - id: A41
    category: filtros
    phase: 3
    title: Average order value above a threshold by status and segment, with enough orders
    request:
      metrics: [average_order_value, order_count]
      dimensions: [orders.status, customers.segment]
      metric_filters: ["{average_order_value} >= 2600 AND {order_count} > 5"]
    user: { region: Northeast }
    sql: |
      SELECT o.status AS orders__status, c.segment AS customers__segment,
             CAST(SUM(o.amount) AS DOUBLE PRECISION) / NULLIF(COUNT(*), 0) AS average_order_value,
             COUNT(*) AS order_count
      FROM public.orders o LEFT JOIN public.customers c ON c.customer_id = o.customer_id
      WHERE c.region = 'Northeast'
      GROUP BY o.status, c.segment
      HAVING CAST(SUM(o.amount) AS DOUBLE PRECISION) / NULLIF(COUNT(*), 0) >= 2600
         AND COUNT(*) > 5
    sql_by_dialect:
      tsql: |
        SELECT o.status AS orders__status, c.segment AS customers__segment,
               CAST(SUM(o.amount) AS FLOAT) / NULLIF(COUNT(*), 0) AS average_order_value,
               COUNT(*) AS order_count
        FROM public.orders o LEFT JOIN public.customers c ON c.customer_id = o.customer_id
        WHERE c.region = 'Northeast'
        GROUP BY o.status, c.segment
        HAVING CAST(SUM(o.amount) AS FLOAT) / NULLIF(COUNT(*), 0) >= 2600
           AND COUNT(*) > 5

  - id: A42
    category: filtros
    phase: 3
    title: A metric filter alongside a cumulative metric is refused (not in this slice)
    request:
      metrics: [revenue_month_to_date, revenue]
      dimensions: [orders.ordered_at__day]
      metric_filters: ["{revenue} > 0"]
    expect_error: QueryError

  - id: A43
    category: filtros
    phase: 3
    title: A metric filter on a metric that is not requested is refused
    request:
      metrics: [revenue]
      dimensions: [orders.status]
      metric_filters: ["{order_count} > 10"]
    expect_error: QueryError

  # -- Date filters do not cut rolling windows short (DEC-34) ----------------
  # The hand-written SQL picks the days the filter keeps, then reads each day's whole window
  # from the facts that pass the other filters only. Upper bounds need nothing earlier.
  - id: A44
    category: tempo
    phase: 3
    title: Rolling 7-day revenue of completed orders by day, between two dates
    request:
      metrics: [revenue_rolling_7_days]
      dimensions: [orders.ordered_at__day]
      filters:
        - "{orders.ordered_at} BETWEEN CURRENT_DATE - INTERVAL '60' DAY AND CURRENT_DATE - INTERVAL '30' DAY"
        - "{orders.status} = 'completed'"
    sql: |
      WITH c AS (SELECT ordered_at, amount FROM public.orders WHERE status = 'completed')
      SELECT d.dd AS orders__ordered_at__day, SUM(c.amount) AS revenue_rolling_7_days
      FROM (
        SELECT DISTINCT DATE_TRUNC('day', ordered_at) AS dd FROM c
        WHERE ordered_at BETWEEN CURRENT_DATE - INTERVAL '60' DAY
                             AND CURRENT_DATE - INTERVAL '30' DAY
      ) d
      JOIN c ON c.ordered_at >= d.dd - INTERVAL '6' DAY AND c.ordered_at < d.dd + INTERVAL '1' DAY
      GROUP BY d.dd
    sql_by_dialect:
      tsql: |
        WITH c AS (SELECT ordered_at, amount FROM public.orders WHERE status = 'completed')
        SELECT d.dd AS orders__ordered_at__day, SUM(c.amount) AS revenue_rolling_7_days
        FROM (
          SELECT DISTINCT DATETRUNC(day, ordered_at) AS dd FROM c
          WHERE ordered_at BETWEEN DATEADD(day, -60, CAST(GETDATE() AS DATE))
                               AND DATEADD(day, -30, CAST(GETDATE() AS DATE))
        ) d
        JOIN c
          ON c.ordered_at >= DATEADD(day, -6, d.dd) AND c.ordered_at < DATEADD(day, 1, d.dd)
        GROUP BY d.dd

  # A date column, a range written as one filter (AND), a 30-day window, null segments and a
  # row filter: the row filter still applies to the facts first.
  - id: A45
    category: tempo
    phase: 3
    title: Rolling 30-day count by segment and day for a date range, under a row filter
    request:
      metrics: [customers_rolling_30_days]
      dimensions: [customers.segment, customers.last_order_at__day]
      filters:
        - "{customers.last_order_at} >= CURRENT_DATE - INTERVAL '120' DAY AND {customers.last_order_at} < CURRENT_DATE - INTERVAL '60' DAY"
    user: { region: Northeast }
    sql: |
      WITH c AS (
        SELECT segment, last_order_at FROM public.customers WHERE region = 'Northeast'
      )
      SELECT d.segment AS customers__segment, d.dd AS customers__last_order_at__day,
             SUM(CASE WHEN c.last_order_at IS NOT NULL THEN 1 END) AS customers_rolling_30_days
      FROM (
        SELECT DISTINCT segment, DATE_TRUNC('day', last_order_at) AS dd FROM c
        WHERE last_order_at >= CURRENT_DATE - INTERVAL '120' DAY
          AND last_order_at < CURRENT_DATE - INTERVAL '60' DAY
      ) d
      LEFT JOIN c
        ON (c.segment = d.segment OR (c.segment IS NULL AND d.segment IS NULL))
        AND c.last_order_at >= d.dd - INTERVAL '29' DAY
        AND c.last_order_at < d.dd + INTERVAL '1' DAY
      GROUP BY d.segment, d.dd
    sql_by_dialect:
      tsql: |
        WITH c AS (
          SELECT segment, last_order_at FROM public.customers WHERE region = 'Northeast'
        )
        SELECT d.segment AS customers__segment, d.dd AS customers__last_order_at__day,
               SUM(CASE WHEN c.last_order_at IS NOT NULL THEN 1 END) AS customers_rolling_30_days
        FROM (
          SELECT DISTINCT segment, DATETRUNC(day, last_order_at) AS dd FROM c
          WHERE last_order_at >= DATEADD(day, -120, CAST(GETDATE() AS DATE))
            AND last_order_at < DATEADD(day, -60, CAST(GETDATE() AS DATE))
        ) d
        LEFT JOIN c
          ON (c.segment = d.segment OR (c.segment IS NULL AND d.segment IS NULL))
          AND c.last_order_at >= DATEADD(day, -29, d.dd)
          AND c.last_order_at < DATEADD(day, 1, d.dd)
        GROUP BY d.segment, d.dd

  # An IN list of days at day grain: each listed day with facts is a row with its whole window.
  # The hand-written SQL selects the days by range, not by truncating.
  - id: A46
    category: tempo
    phase: 3
    title: Rolling 7-day minimum on two listed days
    request:
      metrics: [smallest_order_rolling_7_days]
      dimensions: [orders.ordered_at__day]
      filters:
        - "{orders.ordered_at__day} IN (CURRENT_DATE - INTERVAL '10' DAY, CURRENT_DATE - INTERVAL '20' DAY)"
    sql: |
      SELECT d.dd AS orders__ordered_at__day, MIN(o.amount) AS smallest_order_rolling_7_days
      FROM (
        SELECT DISTINCT DATE_TRUNC('day', ordered_at) AS dd FROM public.orders
        WHERE (ordered_at >= CURRENT_DATE - INTERVAL '10' DAY
               AND ordered_at < CURRENT_DATE - INTERVAL '9' DAY)
           OR (ordered_at >= CURRENT_DATE - INTERVAL '20' DAY
               AND ordered_at < CURRENT_DATE - INTERVAL '19' DAY)
      ) d
      JOIN public.orders o
        ON o.ordered_at >= d.dd - INTERVAL '6' DAY AND o.ordered_at < d.dd + INTERVAL '1' DAY
      GROUP BY d.dd
    sql_by_dialect:
      tsql: |
        SELECT d.dd AS orders__ordered_at__day, MIN(o.amount) AS smallest_order_rolling_7_days
        FROM (
          SELECT DISTINCT DATETRUNC(day, ordered_at) AS dd FROM public.orders
          WHERE (ordered_at >= DATEADD(day, -10, CAST(GETDATE() AS DATE))
                 AND ordered_at < DATEADD(day, -9, CAST(GETDATE() AS DATE)))
             OR (ordered_at >= DATEADD(day, -20, CAST(GETDATE() AS DATE))
                 AND ordered_at < DATEADD(day, -19, CAST(GETDATE() AS DATE)))
        ) d
        JOIN public.orders o
          ON o.ordered_at >= DATEADD(day, -6, d.dd) AND o.ordered_at < DATEADD(day, 1, d.dd)
        GROUP BY d.dd

  # A filter shape the planner cannot split (NOT) keeps the behaviour before DEC-34: it
  # restricts the facts first, so the first days of the range see only the filtered facts.
  - id: A47
    category: tempo
    phase: 3
    title: A NOT filter on the time dimension still cuts the first windows of the range
    request:
      metrics: [revenue_rolling_7_days]
      dimensions: [orders.ordered_at__day]
      filters: ["NOT ({orders.ordered_at} < CURRENT_DATE - INTERVAL '45' DAY)"]
    sql: |
      WITH f AS (
        SELECT ordered_at, amount FROM public.orders
        WHERE ordered_at >= CURRENT_DATE - INTERVAL '45' DAY
      )
      SELECT d.dd AS orders__ordered_at__day, SUM(f.amount) AS revenue_rolling_7_days
      FROM (SELECT DISTINCT DATE_TRUNC('day', ordered_at) AS dd FROM f) d
      JOIN f ON f.ordered_at >= d.dd - INTERVAL '6' DAY AND f.ordered_at < d.dd + INTERVAL '1' DAY
      GROUP BY d.dd
    sql_by_dialect:
      tsql: |
        WITH f AS (
          SELECT ordered_at, amount FROM public.orders
          WHERE ordered_at >= DATEADD(day, -45, CAST(GETDATE() AS DATE))
        )
        SELECT d.dd AS orders__ordered_at__day, SUM(f.amount) AS revenue_rolling_7_days
        FROM (SELECT DISTINCT DATETRUNC(day, ordered_at) AS dd FROM f) d
        JOIN f
          ON f.ordered_at >= DATEADD(day, -6, d.dd) AND f.ordered_at < DATEADD(day, 1, d.dd)
        GROUP BY d.dd

  # An upper bound inside a day on the timestamp column (12:00, 22 days ago): that day is kept
  # (it has orders before noon) and its window still holds its orders after noon. The lower
  # bound is at midnight. `CAST(... AS DATETIME)` keeps the hour arithmetic valid in SQL
  # Server, where a DATE takes no hours.
  - id: A48
    category: tempo
    phase: 3
    title: Rolling 7-day revenue and minimum up to noon of a day, with that day's window whole
    request:
      metrics: [revenue_rolling_7_days, smallest_order_rolling_7_days]
      dimensions: [orders.ordered_at__day]
      filters:
        - "{orders.ordered_at} >= CURRENT_DATE - INTERVAL '40' DAY"
        - "{orders.ordered_at} <= CAST(CURRENT_DATE AS DATETIME) - INTERVAL '516' HOUR"
    sql: |
      WITH f AS (
        SELECT ordered_at FROM public.orders
        WHERE ordered_at >= CURRENT_DATE - INTERVAL '40' DAY
          AND ordered_at <= CAST(CURRENT_DATE AS TIMESTAMP) - INTERVAL '516' HOUR
      )
      SELECT d.dd AS orders__ordered_at__day, SUM(o.amount) AS revenue_rolling_7_days,
             MIN(o.amount) AS smallest_order_rolling_7_days
      FROM (SELECT DISTINCT DATE_TRUNC('day', ordered_at) AS dd FROM f) d
      JOIN public.orders o
        ON o.ordered_at >= d.dd - INTERVAL '6' DAY AND o.ordered_at < d.dd + INTERVAL '1' DAY
      GROUP BY d.dd
    sql_by_dialect:
      tsql: |
        WITH f AS (
          SELECT ordered_at FROM public.orders
          WHERE ordered_at >= DATEADD(day, -40, CAST(GETDATE() AS DATE))
            AND ordered_at <= DATEADD(hour, -516, CAST(CAST(GETDATE() AS DATE) AS DATETIME2))
        )
        SELECT d.dd AS orders__ordered_at__day, SUM(o.amount) AS revenue_rolling_7_days,
               MIN(o.amount) AS smallest_order_rolling_7_days
        FROM (SELECT DISTINCT DATETRUNC(day, ordered_at) AS dd FROM f) d
        JOIN public.orders o
          ON o.ordered_at >= DATEADD(day, -6, d.dd) AND o.ordered_at < DATEADD(day, 1, d.dd)
        GROUP BY d.dd

  # -- The same input read shifted and unshifted, through an alias (DEC-44) --------------
  # `revenue_yoy_growth` reads `revenue` at the same period and, as `revenue_year_before`, 12
  # months earlier, in one metric. The hand-written SQL pairs periods by a period number, never
  # by date arithmetic, as in A35 to A37.
  - id: A49
    category: tempo
    phase: 3
    title: Revenue and year-over-year growth by month, from one metric with an aliased offset input
    request:
      metrics: [revenue, revenue_yoy_growth]
      dimensions: [orders.ordered_at__month]
    sql: |
      WITH monthly AS (
        SELECT DATE_TRUNC('month', ordered_at) AS mon,
               EXTRACT(YEAR FROM ordered_at) * 12 + EXTRACT(MONTH FROM ordered_at) AS k,
               SUM(amount) AS revenue
        FROM public.orders
        GROUP BY DATE_TRUNC('month', ordered_at),
                 EXTRACT(YEAR FROM ordered_at) * 12 + EXTRACT(MONTH FROM ordered_at)
      )
      SELECT cur.mon AS orders__ordered_at__month, cur.revenue AS revenue,
             CAST(cur.revenue - prev.revenue AS DOUBLE PRECISION) / NULLIF(prev.revenue, 0)
               AS revenue_yoy_growth
      FROM monthly cur
      LEFT JOIN monthly prev ON prev.k = cur.k - 12
    sql_by_dialect:
      tsql: |
        WITH monthly AS (
          SELECT DATETRUNC(month, ordered_at) AS mon,
                 YEAR(ordered_at) * 12 + MONTH(ordered_at) AS k,
                 SUM(amount) AS revenue
          FROM public.orders
          GROUP BY DATETRUNC(month, ordered_at), YEAR(ordered_at) * 12 + MONTH(ordered_at)
        )
        SELECT cur.mon AS orders__ordered_at__month, cur.revenue AS revenue,
               CAST(cur.revenue - prev.revenue AS FLOAT) / NULLIF(prev.revenue, 0)
                 AS revenue_yoy_growth
        FROM monthly cur
        LEFT JOIN monthly prev ON prev.k = cur.k - 12

  - id: A50
    category: tempo
    phase: 3
    title: Year-over-year growth by year (12 months is one year)
    request:
      metrics: [revenue, revenue_yoy_growth]
      dimensions: [orders.ordered_at__year]
    sql: |
      WITH yearly AS (
        SELECT DATE_TRUNC('year', ordered_at) AS yr, EXTRACT(YEAR FROM ordered_at) AS k,
               SUM(amount) AS revenue
        FROM public.orders
        GROUP BY DATE_TRUNC('year', ordered_at), EXTRACT(YEAR FROM ordered_at)
      )
      SELECT cur.yr AS orders__ordered_at__year, cur.revenue AS revenue,
             CAST(cur.revenue - prev.revenue AS DOUBLE PRECISION) / NULLIF(prev.revenue, 0)
               AS revenue_yoy_growth
      FROM yearly cur
      LEFT JOIN yearly prev ON prev.k = cur.k - 1
    sql_by_dialect:
      tsql: |
        WITH yearly AS (
          SELECT DATETRUNC(year, ordered_at) AS yr, YEAR(ordered_at) AS k,
                 SUM(amount) AS revenue
          FROM public.orders
          GROUP BY DATETRUNC(year, ordered_at), YEAR(ordered_at)
        )
        SELECT cur.yr AS orders__ordered_at__year, cur.revenue AS revenue,
               CAST(cur.revenue - prev.revenue AS FLOAT) / NULLIF(prev.revenue, 0)
                 AS revenue_yoy_growth
        FROM yearly cur
        LEFT JOIN yearly prev ON prev.k = cur.k - 1

  # Month-over-month growth (through the helper metric `revenue_prev_month`) and
  # year-over-year growth (through an alias) side by side, by status, with a filter that
  # removes facts before the shift: the earlier periods are read from the filtered facts too.
  - id: A51
    category: tempo
    phase: 3
    title: Month-over-month and year-over-year growth by status and month, without canceled orders
    request:
      metrics: [revenue, revenue_mom_growth, revenue_yoy_growth]
      dimensions: [orders.status, orders.ordered_at__month]
      filters:
        - "{orders.status} <> 'canceled'"
    sql: |
      WITH monthly AS (
        SELECT status, DATE_TRUNC('month', ordered_at) AS mon,
               EXTRACT(YEAR FROM ordered_at) * 12 + EXTRACT(MONTH FROM ordered_at) AS k,
               SUM(amount) AS revenue
        FROM public.orders
        WHERE status <> 'canceled'
        GROUP BY status, DATE_TRUNC('month', ordered_at),
                 EXTRACT(YEAR FROM ordered_at) * 12 + EXTRACT(MONTH FROM ordered_at)
      )
      SELECT cur.status AS orders__status, cur.mon AS orders__ordered_at__month,
             cur.revenue AS revenue,
             CAST(cur.revenue - m.revenue AS DOUBLE PRECISION) / NULLIF(m.revenue, 0)
               AS revenue_mom_growth,
             CAST(cur.revenue - y.revenue AS DOUBLE PRECISION) / NULLIF(y.revenue, 0)
               AS revenue_yoy_growth
      FROM monthly cur
      LEFT JOIN monthly m
        ON (m.status = cur.status OR (m.status IS NULL AND cur.status IS NULL))
        AND m.k = cur.k - 1
      LEFT JOIN monthly y
        ON (y.status = cur.status OR (y.status IS NULL AND cur.status IS NULL))
        AND y.k = cur.k - 12
    sql_by_dialect:
      tsql: |
        WITH monthly AS (
          SELECT status, DATETRUNC(month, ordered_at) AS mon,
                 YEAR(ordered_at) * 12 + MONTH(ordered_at) AS k,
                 SUM(amount) AS revenue
          FROM public.orders
          WHERE status <> 'canceled'
          GROUP BY status, DATETRUNC(month, ordered_at), YEAR(ordered_at) * 12 + MONTH(ordered_at)
        )
        SELECT cur.status AS orders__status, cur.mon AS orders__ordered_at__month,
               cur.revenue AS revenue,
               CAST(cur.revenue - m.revenue AS FLOAT) / NULLIF(m.revenue, 0)
                 AS revenue_mom_growth,
               CAST(cur.revenue - y.revenue AS FLOAT) / NULLIF(y.revenue, 0)
                 AS revenue_yoy_growth
        FROM monthly cur
        LEFT JOIN monthly m
          ON (m.status = cur.status OR (m.status IS NULL AND cur.status IS NULL))
          AND m.k = cur.k - 1
        LEFT JOIN monthly y
          ON (y.status = cur.status OR (y.status IS NULL AND cur.status IS NULL))
          AND y.k = cur.k - 12

  # A52 to A54 (rolling windows in weeks, DEC-27) are in tests/test_reference.py: they need
  # metrics the example does not have.

  # Structured filters (DEC-50): objects {dimension, op, value}, whose values the engine writes
  # as literals of each dialect. The `not in` list holds a quote and a backslash before a quote,
  # which no segment carries: on every database it keeps exactly the non-null segments, and a
  # literal escaped the wrong way would be a syntax error or a different filter.
  - id: A55
    category: filters
    phase: 3
    title: Revenue and orders by state, with structured filters holding quotes and backslashes
    request:
      metrics: [revenue, order_count]
      dimensions: [customers.state]
      filters:
        - { dimension: orders.status, op: in, value: [completed, pending] }
        - { dimension: customers.segment, op: not in, value: ["O'Brien", "a\\'b"] }
        - { dimension: customers.segment, op: "!=", value: Enterprise }
    user: { region: Midwest }
    sql: |
      SELECT c.state AS customers__state, SUM(o.amount) AS revenue, COUNT(*) AS order_count
      FROM public.orders o LEFT JOIN public.customers c ON c.customer_id = o.customer_id
      WHERE o.status IN ('completed', 'pending')
        AND c.segment IS NOT NULL
        AND c.segment <> 'Enterprise'
        AND c.region = 'Midwest'
      GROUP BY c.state

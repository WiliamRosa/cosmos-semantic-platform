name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cosmos
          POSTGRES_PASSWORD: cosmos
          POSTGRES_DB: cosmos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cosmos" --health-interval 2s --health-retries 30
    env:
      COSMOS_PG_URI: postgresql://cosmos:cosmos@localhost:5432/cosmos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run cosmos validate -m examples/ecommerce/semantic
      - run: uv run pytest -q

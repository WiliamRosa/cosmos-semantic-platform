name: dco

# Every commit in a pull request must carry a `Signed-off-by:` line (Developer Certificate of
# Origin), as CONTRIBUTING.md asks. `git commit -s` adds it; `git rebase --signoff main` fixes a
# branch whose commits lack it.

on:
  pull_request:

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with 'git commit -s', or fix the branch with 'git rebase --signoff $BASE' and force-push it."
            exit 1
          fi

name: Bug report
description: A wrong number, an error, or a command that does not do what the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security issues, do not open an issue: see [SECURITY.md](https://github.com/WiliamRosa/cosmos-semantic-platform/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        I ran `cosmos query revenue --by orders.status` and expected ..., but got ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The smallest model and command that show the problem. The example from `cosmos init` is a good starting point.
        For a wrong number, include the generated SQL (`--show-sql`) and the SQL you expected, if you have it.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Data source
      multiple: true
      options:
        - DuckDB
        - Postgres
        - SQL Server
        - Databricks
        - Not database-specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show cosmos-semantic` (or the commit, if you run from source).
      placeholder: "0.3.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and the database version if relevant.
      placeholder: "Windows 11, Python 3.12, Databricks SQL serverless"

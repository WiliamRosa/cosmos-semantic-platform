<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- 1280x640 link preview, rendered by capture.py into docs/assets/social-preview.png. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b1220; --bg2: #0f1a2e; --ink: #f8fafc; --muted: #94a3b8; --sky: #38bdf8; }
  html, body { margin: 0; }
  #card {
    width: 1280px; height: 640px; position: relative; overflow: hidden; color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    background:
      radial-gradient(700px 420px at 88% 0%, rgba(56, 189, 248, .20), transparent 60%),
      radial-gradient(500px 300px at 0% 100%, rgba(52, 211, 153, .08), transparent 60%),
      linear-gradient(120deg, var(--bg) 0%, var(--bg2) 100%);
  }
  .grid { position: absolute; inset: 0; background-image:
    linear-gradient(rgba(148, 163, 184, .06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .06) 1px, transparent 1px);
    background-size: 32px 32px; }
  .copy { position: absolute; left: 72px; top: 72px; width: 560px; }
  .logo { height: 58px; display: block; margin-left: -10px; }
  h1 { font-size: 58px; line-height: 1.05; letter-spacing: -.03em; font-weight: 800; margin: 40px 0 22px; }
  h1 b { color: var(--sky); }
  p { font-size: 22px; line-height: 1.45; color: #cbd5e1; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .chips span { font: 500 15px "JetBrains Mono", monospace; border: 1px solid rgba(56, 189, 248, .35);
    background: rgba(56, 189, 248, .08); padding: 7px 13px; border-radius: 999px; }
  .shot { position: absolute; left: 700px; top: 88px; width: 760px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 40px 90px rgba(0, 0, 0, .55), 0 0 0 1px rgba(148, 163, 184, .25);
    transform: perspective(1600px) rotateY(-12deg) rotateX(3deg); transform-origin: left center; }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
<div id="card">
  <div class="grid"></div>
  <div class="copy">
    <img class="logo" src="../../marketing/brand/cosmos-semantic-horizontal-dark.svg" alt="Cosmos Semantic">
    <h1>Verifiable numbers for <b>AI agents</b></h1>
    <p>An open-source semantic layer with an ontology at its core. The same number on nine databases and data platforms, with the proof in every answer.</p>
    <div class="chips"><span>MCP</span><span>Ontology</span><span>9 databases &amp; platforms</span><span>Apache 2.0</span></div>
  </div>
  <div class="shot"><img src="console-overview.png" alt=""></div>
</div>
</body>
</html>
